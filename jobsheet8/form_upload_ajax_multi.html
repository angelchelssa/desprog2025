<!DOCTYPE html>
<html>
<head>
    <title>Multi Upload Gambar dengan AJAX</title>
    <style>
        .upload-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .file-input {
            padding: 10px;
            margin: 10px 0;
            border: 2px dashed #ccc;
            border-radius: 4px;
            width: 100%;
            background: white;
        }
        .submit-btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .file-result {
            border: 1px solid #eee;
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: white;
        }
        .file-header {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 3px;
            font-size: 14px;
        }
        .file-details {
            padding: 10px;
        }
        .thumbnail {
            max-width: 150px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 8px;
        }
        .success { 
            color: #28a745; 
            font-weight: bold;
        }
        .error { 
            color: #dc3545; 
            font-weight: bold;
        }
        .loading { 
            color: #ffc107; 
            font-weight: bold;
        }
        .summary {
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
        .alert {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .file-info {
            font-size: 12px;
            color: #666;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h2>🖼️ Multi Upload Gambar dengan AJAX</h2>
        <p>Pilih multiple file gambar (JPG, JPEG, PNG, GIF - maks 2MB per file)</p>
        
        <form id="upload-form" method="post" enctype="multipart/form-data">
            <input type="file" name="files[]" id="files" multiple accept=".jpg,.jpeg,.png,.gif" class="file-input">
            <br>
            <button type="submit" class="submit-btn" id="upload-button">Upload Gambar</button>
        </form>
        <div id="status"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="upload_multi.js"></script>
</body>
</html>
